name: Server physics smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nape-physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and extract original engine assets
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check authoritative-match.js
          node --check public/engine-sync.js
          node --check public/engine-network.js
          node --check scripts/patch-original-game.js
      - name: Run authoritative Nape physics smoke test
        run: node scripts/physics-smoke-test.js
