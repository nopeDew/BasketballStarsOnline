name: Native multiplayer checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and patch the original game
        run: npm install
      - name: Check multiplayer scripts
        run: |
          node --check server.js
          node --check public/engine-sync.js
          node --check public/engine-network.js
          node --check scripts/patch-original-game.js
          node --check scripts/multiplayer-sync-test.js
          node scripts/multiplayer-sync-test.js
      - name: Export original engine source for multiplayer diagnosis
        if: always()
        run: |
          zip -q -j /tmp/bso-engine-source.zip engine-source/basketball_legends_2019.f.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-engine-source
          path: /tmp/bso-engine-source.zip
          retention-days: 1
