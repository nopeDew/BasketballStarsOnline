name: Native multiplayer checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and patch the original game
        run: npm install
      - name: Inspect PlayerObject update hot path
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('engine-source/basketball_legends_2019.f.js', 'utf8');
          const arrayStart = source.indexOf("}([function(t, e, i) {");
          const modules = source.slice(arrayStart + "}([".length).split(/\n, function\([^)]*\) \{\n/);
          const code = modules[85] || '';
          for (const needle of ['e.prototype.update = function', 'this.controller =', 'new r.PlayerController', 'PlayerController2', 'controller.update']) {
            let at = -1, count = 0;
            while ((at = code.indexOf(needle, at + 1)) !== -1 && count++ < 5) {
              console.log('\\n=== ' + needle + ' at ' + at + ' ===\\n');
              console.log(code.slice(Math.max(0, at - 1000), Math.min(code.length, at + 4200)));
            }
          }
          NODE
      - name: Check multiplayer scripts
        run: |
          node --check server.js
          node --check public/engine-sync.js
          node --check public/engine-network.js
          node --check scripts/patch-original-game.js
          node --check scripts/multiplayer-sync-test.js
          node scripts/multiplayer-sync-test.js
