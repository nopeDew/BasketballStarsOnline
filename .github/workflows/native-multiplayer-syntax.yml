name: Native multiplayer checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and patch the original game
        run: npm install
      - name: Inspect original controller and game-core update paths
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('engine-source/basketball_legends_2019.f.js', 'utf8');
          const arrayStart = source.indexOf("}([function(t, e, i) {");
          if (arrayStart < 0) throw new Error('Could not locate webpack module array.');
          const moduleSource = source.slice(arrayStart + "}([".length);
          const modules = moduleSource.split(/\\n, function\\(t, e, i\\) \\{\\n/);
          console.log('Original module count:', modules.length);
          for (const id of [13, 94]) {
            const code = modules[id] || '';
            console.log('\\n=== ORIGINAL MODULE ' + id + ' (' + code.length + ' chars) ===\\n');
            console.log(code.slice(0, 14000));
          }
          NODE
      - name: Check multiplayer scripts
        run: |
          node --check server.js
          node --check public/engine-sync.js
          node --check public/engine-network.js
          node --check scripts/patch-original-game.js
          node --check scripts/multiplayer-sync-test.js
          node scripts/multiplayer-sync-test.js
